
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>📘 Math Assistant</h1>
    <button id="darkToggle">🌙</button>
</header>

<!-- TAB MENU -->
<nav>
    <button class="tabBtn" data-target="materiPage">📚 Materi</button>
    <button class="tabBtn" data-target="latihanPage">📝 Latihan</button>
    <button class="tabBtn" data-target="trikPage">⚡ Trik Cepat</button>
    <button class="tabBtn" data-target="aboutPage">ℹ️ Tentang</button>
</nav>

<!-- ========================= -->
<!--        HALAMAN MATERI     -->
<!-- ========================= -->
<section id="materiPage" class="page hidden">

    <h2>📚 Daftar Materi Kelas 10</h2>

    <input type="text" id="searchMateri" placeholder="Cari materi...">

    <div id="materiList" class="cardList"></div>

</section>

<!-- ========================= -->
<!--      HALAMAN LATIHAN      -->
<!-- ========================= -->
<section id="latihanPage" class="page hidden">

    <h2>📝 Latihan Soal</h2>

    <div id="latihanList" class="cardList"></div>

    <div id="quizArea" class="hidden">
        <h3 id="quizTitle"></h3>
        <p id="quizQuestion"></p>

        <input type="text" id="quizAnswer" placeholder="Jawaban Kamu...">
        <button id="submitAns">Kirim Jawaban</button>

        <p id="quizFeedback"></p>
        <button id="nextQuiz" class="hidden">Soal Berikutnya</button>
    </div>

</section>

<!-- ========================= -->
<!--        TRIK CEPAT         -->
<!-- ========================= -->
<section id="trikPage" class="page hidden">

    <h2>⚡ Trik Cepat Matematika</h2>
    <div id="trikList" class="cardList"></div>

</section>

<!-- ========================= -->
<!--         TENTANG           -->
<!-- ========================= -->
<section id="aboutPage" class="page hidden">

    <h2>ℹ️ Tentang Aplikasi</h2>
    <p>Aplikasi ini dibuat untuk membantu siswa SMA mempelajari materi kelas 10 dengan cara yang lebih mudah.</p>

</section>

<script src="script.js"></script>
</body>
</html>
