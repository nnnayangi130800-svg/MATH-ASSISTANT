
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Assistant — Kelas 10 SMA</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="wrap">

    <header>
        <h1>Math Assistant</h1>
        <p class="sub">Materi • Latihan • Trik Cepat — Kelas 10 SMA Semester 1</p>
    </header>

    <!-- SEARCH -->
    <div class="search-box">
        <input id="searchInput" oninput="searchContent()" placeholder="Cari materi…">
    </div>

    <!-- DARK MODE -->
    <div class="darkmode-box">
        <label class="switch">
            <input type="checkbox" id="darkToggle" onchange="toggleDarkMode()">
            <span class="slider round"></span>
        </label>
        <span class="dm-text">Dark Mode</span>
    </div>

    <!-- HOME PAGE -->
    <section id="homePage" class="page active">
        <div class="tiles">
            <button class="tile" onclick="loadMateri()">📘 <br> Materi</button>
            <button class="tile" onclick="loadLatihan()">📝 <br> Latihan</button>
            <button class="tile" onclick="loadTrikCepat()">⚡ <br> Trik Cepat</button>
            <button class="tile" onclick="loadTentang()">ℹ️ <br> Tentang</button>
        </div>
    </section>

    <!-- CONTENT PAGE -->
    <section id="contentPage" class="page">
        <div id="content"></div>
        <button class="back" onclick="goHome()">Kembali</button>
    </section>

</div>

<script src="script.js"></script>
</body>
</html>
